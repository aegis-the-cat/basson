[project]
name = "basson"
dynamic = ["version"]
authors = [{ name="aegis (the cat)", email="spam.rg@yandex.ru" }]
description = "Easy-to-use wrapper for BASS audio library"
license = "MIT"
license-files = ["basson.LICENSE", "bass.LICENSE"]
readme = "readme.md"
requires-python = ">=3.10.0"
classifiers = [
   "Programming Language :: Python :: 3 :: Only",
   "License :: OSI Approved :: MIT License",
   "Operating System :: OS Independent"
   ]

[project.urls]
Homepage = "https://github.com/aegis-the-cat/basson"

[dependency-groups]
    dev = [
    "ruff",
    "pytest",
    "build",
    "twine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/basson/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/basson"]

[tool.hatch.build.targets.sdist]
include = [
    "src/basson/", 
    "readme.md", "docs/",
    "basson.LICENSE", 
    "bass.LICENSE", 
    "pyproject.toml"]
